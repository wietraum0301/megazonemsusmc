<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <meta
    name="description"
    content="부산 고객 세미나 발표 자료, Hands-on 실습 자료와 Microsoft 365 Copilot 데모 영상"
  />

  <title>부산 고객 세미나 참석 감사</title>

  <style>
    :root {
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --indigo: #4f46e5;
      --cyan: #38bdf8;
      --navy: #0f172a;
      --slate: #64748b;
      --bg: #f4f7fb;
      --surface: #fff;
      --line: #e2e8f0;
      --shadow: 0 10px 30px rgba(15,23,42,.07);
      --hover: 0 22px 50px rgba(37,99,235,.15);

      --ui-ink: #0f2138;
      --ui-deep: #004c8f;
      --ui-cyan: #12d6f2;
      --ui-glass: #ffffff;
      --ui-stroke: rgba(0,95,170,.1);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      padding-bottom: 82px;
      color: #182230;
      background:
        radial-gradient(circle at 10% 0%, rgba(56,189,248,.08), transparent 28%),
        var(--bg);
      font-family: "Segoe UI", "Noto Sans KR", Arial, sans-serif;
    }

    a:focus-visible,
    video:focus-visible {
      outline: 3px solid rgba(56,189,248,.9);
      outline-offset: 3px;
    }

    /* =========================================================
       GLOBAL HEADER / NAVIGATION
       ========================================================= */
    [data-global-header] {
      position: relative;
      z-index: 1000;
    }

    [data-global-header] nav {
      position: sticky;
      top: 0;
      z-index: 1001;
      background: var(--ui-glass) !important;
      border-bottom: 1px solid var(--ui-stroke);
      box-shadow: 0 6px 20px rgba(7,31,58,.05);
    }

    [data-global-header] .nav-inner {
      width: min(1120px, 100%);
      margin: 0 auto;
      padding: 0 20px;
      min-height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    [data-global-header] .nav-left,
    [data-global-header] .nav-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    [data-global-header] .brand {
      color: var(--ui-ink);
      font-weight: 800;
      text-decoration: none;
      white-space: nowrap;
    }

    [data-global-header] .nav-link,
    [data-global-header] .nav-dropdown-toggle {
      border: 0;
      background: transparent;
      color: #17406d;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      padding: 10px 12px;
      border-radius: 10px;
      cursor: pointer;
    }

    [data-global-header] .nav-link:hover,
    [data-global-header] .nav-dropdown-toggle:hover {
      background: rgba(0,95,170,.06);
    }

    .dropdown-shadow {
      box-shadow:
        0 18px 42px -12px rgba(0,95,170,.12),
        0 8px 20px -8px rgba(16,28,46,.1),
        0 3px 8px rgba(16,28,46,.05),
        0 0 0 1px rgba(0,95,170,.08);
    }

    .nav-dropdown { position: relative; }

    .nav-dropdown-menu {
      position: absolute;
      left: 50%;
      top: calc(100% + 10px);
      min-width: 260px;
      padding: 10px;
      border-radius: 14px;
      border: 1px solid rgba(0,95,170,.12) !important;
      background: rgba(255,255,255,.94) !important;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

      opacity: 0;
      visibility: hidden;
      transform: translateX(-50%) translateY(6px);
      transition: all .3s cubic-bezier(.22,1,.36,1);
      max-height: 70vh;
      overflow-y: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      z-index: 1200;
    }

    .nav-dropdown-menu::-webkit-scrollbar { display: none; }

    .nav-dropdown.active .nav-dropdown-menu {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    .nav-dropdown.active .chevron { transform: rotate(180deg); }
    .chevron { transition: transform .3s ease; margin-left: 6px; }

    .dropdown-item {
      display: flex;
      align-items: center;
      gap: 10px;
      position: relative;
      transition: all .3s cubic-bezier(.22,1,.36,1);
      overflow: hidden;
      border-radius: 10px;
      padding: 10px 12px;
      text-decoration: none;
      color: #15385f;
    }

    .dropdown-item::before {
      content: "";
      position: absolute;
      left: 0;
      top: 50%;
      transform: translateY(-50%);
      width: 3px;
      height: 0;
      background: linear-gradient(180deg,#005faa,#00e3fd);
      border-radius: 0 3px 3px 0;
      transition: height .3s cubic-bezier(.22,1,.36,1);
    }

    .dropdown-item:hover {
      background: linear-gradient(135deg, rgba(0,95,170,.06), rgba(0,227,253,.04));
      transform: translateX(4px);
      box-shadow: 0 4px 16px rgba(0,95,170,.08);
    }

    .dropdown-item:hover::before { height: 60%; }

    .dropdown-item .dropdown-arrow {
      opacity: 0;
      transform: translateX(-6px);
      transition: all .3s cubic-bezier(.22,1,.36,1);
      margin-left: auto;
      color: #005faa;
      font-weight: bold;
      flex-shrink: 0;
    }

    .dropdown-item:hover .dropdown-arrow {
      opacity: 1;
      transform: translateX(0);
    }

    .nav-dropdown-toggle {
      position: relative;
      padding-bottom: .4rem;
    }

    .nav-dropdown-toggle::after {
      content: "";
      position: absolute;
      left: .7rem;
      right: .7rem;
      bottom: .1rem;
      height: 2px;
      background: linear-gradient(90deg,#005faa,#00e3fd);
      transform: scaleX(0);
      transform-origin: left center;
      transition: transform .25s ease;
      border-radius: 999px;
    }

    .nav-dropdown-toggle:hover::after,
    .nav-dropdown.active .nav-dropdown-toggle::after {
      transform: scaleX(1);
    }

    .nav-dropdown-menu .dropdown-arrow { display: none !important; }

    [data-global-header] .mobile-toggle {
      display: none;
      border: 0;
      background: transparent;
      font-size: 20px;
      cursor: pointer;
      color: #17406d;
      padding: 8px 10px;
      border-radius: 8px;
    }

    [data-global-header] .mobile-menu {
      display: none;
      border-top: 1px solid rgba(0,95,170,.1);
      padding: 10px 20px 14px;
      background: #fff;
    }

    [data-global-header] .mobile-menu.open { display: block; }

    [data-global-header] .mobile-menu a,
    [data-global-header] .mobile-menu button {
      width: 100%;
      text-align: left;
      display: block;
      border: 0;
      background: transparent;
      padding: 10px 8px;
      color: #17406d;
      font-weight: 700;
      text-decoration: none;
    }

    /* =========================================================
       PAGE
       ========================================================= */
    .page {
      width: min(1120px,100%);
      margin: 0 auto;
      overflow: visible; /* 핵심: 드롭다운 잘림 방지 */
      background: var(--surface);
      border: 1px solid rgba(226,232,240,.85);
      border-radius: 0 0 30px 30px;
      box-shadow: 0 24px 70px rgba(15,23,42,.1);
    }

    .hero {
      position: relative;
      overflow: hidden;
      padding: 76px 7%;
      color: #fff;
      background:
        radial-gradient(circle at 85% 12%, rgba(56,189,248,.42), transparent 27%),
        radial-gradient(circle at 15% 100%, rgba(79,70,229,.35), transparent 33%),
        linear-gradient(135deg,#07182e,#174d9c 58%,#4f46e5);
    }

    .hero::after {
      content: "";
      position: absolute;
      top: -110px;
      right: -90px;
      width: 310px;
      height: 310px;
      border: 1px solid rgba(255,255,255,.13);
      border-radius: 50%;
      box-shadow: 0 0 0 42px rgba(255,255,255,.035), 0 0 0 84px rgba(255,255,255,.025);
    }

    .hero > * { position: relative; z-index: 1; }

    .eyebrow, .pill {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      border-radius: 999px;
      font-weight: 800;
      letter-spacing: 1.2px;
    }

    .eyebrow {
      padding: 7px 13px;
      color: #c5f0ff;
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(168,231,255,.3);
      font-size: 11px;
    }

    .hero h1 {
      max-width: 850px;
      margin: 20px 0 18px;
      font-size: clamp(34px,5vw,50px);
      line-height: 1.23;
      letter-spacing: -1.5px;
    }

    .hero p {
      max-width: 820px;
      margin: 0;
      color: #edf6ff;
      font-size: 18px;
      line-height: 1.75;
    }

    section { padding: 58px 7%; }
    .soft { background: #eef5ff; }

    .heading { margin-bottom: 34px; }

    .heading h2 {
      display: inline-block;
      margin: 0;
      color: var(--navy);
      font-size: 29px;
      line-height: 1.35;
      letter-spacing: -.7px;
    }

    .heading h2::after {
      content: "";
      display: block;
      width: 46px;
      height: 4px;
      margin-top: 12px;
      background: linear-gradient(90deg,var(--blue),var(--cyan));
      border-radius: 999px;
    }

    .heading p {
      max-width: 820px;
      margin: 17px 0 0;
      color: var(--slate);
      font-size: 16px;
      line-height: 1.75;
    }

    .session-grid, .demo-grid {
      display: grid;
      grid-template-columns: repeat(3,minmax(0,1fr));
      gap: 20px;
    }

    .session-card, .demo-card {
      min-width: 0;
      overflow: hidden;
      background: #fff;
      border: 1px solid var(--line);
      border-radius: 22px;
      box-shadow: var(--shadow);
      transition: transform .25s ease, box-shadow .25s ease, border-color .25s ease;
    }

    .session-card {
      display: flex;
      flex-direction: column;
      min-height: 300px;
      padding: 28px 24px;
      background: linear-gradient(#fff,#fff) padding-box, linear-gradient(135deg,#dbeafe,#e0e7ff) border-box;
      border: 1px solid transparent;
    }

    .session-card:hover, .demo-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--hover);
      border-color: #bfdbfe;
    }

    .pill {
      margin-bottom: 14px;
      padding: 7px 11px;
      color: var(--blue);
      background: #eff6ff;
      border: 1px solid #dbeafe;
      font-size: 10px;
      line-height: 1;
    }

    h3 {
      margin: 0 0 10px;
      color: var(--navy);
      font-size: 20px;
      line-height: 1.4;
      letter-spacing: -.4px;
    }

    .session-card p, .demo-card p {
      margin: 0;
      color: var(--slate);
      font-size: 15px;
      line-height: 1.65;
    }

    .actions {
      display: grid;
      gap: 9px;
      margin-top: auto;
      padding-top: 24px;
    }

    .actions.split { grid-template-columns: 1fr; }

    .button {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 46px;
      padding: 11px 14px;
      color: #fff;
      background: linear-gradient(135deg,var(--blue),var(--indigo));
      border: 1px solid transparent;
      border-radius: 13px;
      font-size: 13px;
      font-weight: 700;
      text-align: center;
      text-decoration: none;
      box-shadow: 0 8px 20px rgba(37,99,235,.2);
      transition: transform .2s ease, filter .2s ease;
    }

    .button.secondary {
      color: var(--blue-dark);
      background: #eff6ff;
      border-color: #bfdbfe;
      box-shadow: none;
    }

    .button:hover {
      filter: brightness(1.06);
      transform: translateY(-1px);
    }

    .demo-grid { grid-template-columns: repeat(6,minmax(0,1fr)); }
    .demo-card { grid-column: span 2; }
    .demo-card:nth-child(4) { grid-column: 2 / span 2; }
    .demo-card:nth-child(5) { grid-column: 4 / span 2; }

    .demo-copy { min-height: 188px; padding: 25px 23px 22px; }

    .video-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 16px;
      color: #fff;
      background: linear-gradient(135deg,#0f172a,#1e3a5f);
      font-size: 12px;
      font-weight: 700;
    }

    .play {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 27px;
      height: 27px;
      background: linear-gradient(135deg,var(--blue),var(--cyan));
      border-radius: 50%;
      font-size: 9px;
    }

    .video-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16/9;
      background: #071c36;
    }

    .video-wrap video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #071c36;
    }

    .video-footer {
      padding: 14px 18px 16px;
      background: linear-gradient(180deg,#fff,#f8fafc);
    }

    .video-footer a {
      color: var(--blue);
      font-size: 13px;
      font-weight: 700;
      text-decoration: none;
    }

    .video-footer a:hover {
      color: var(--blue-dark);
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    .next-box {
      position: relative;
      overflow: hidden;
      padding: 40px;
      background: linear-gradient(135deg,#fff,#f5f8ff);
      border: 1px solid #dbeafe;
      border-radius: 25px;
      box-shadow: 0 13px 37px rgba(15,23,42,.07);
    }

    .next-box h2 {
      margin: 0 0 13px;
      color: var(--navy);
      font-size: 27px;
    }

    .next-box p {
      max-width: 830px;
      margin: 0 0 24px;
      color: var(--slate);
      font-size: 16px;
      line-height: 1.8;
    }

    .next-box .button {
      display: inline-flex;
      padding-inline: 22px;
    }

    footer {
      padding: 31px 7%;
      color: #c8d5e8;
      background: #071c36;
      font-size: 13px;
      line-height: 1.7;
    }

    .floating-contact {
      position: fixed;
      right: 28px;
      bottom: 28px;
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      gap: 9px;
      min-height: 54px;
      padding: 0 20px;
      color: #fff;
      background: linear-gradient(135deg, #2563eb, #4f46e5 55%, #2563eb);
      border: 1px solid rgba(255,255,255,.2);
      border-radius: 999px;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 12px 28px rgba(37,99,235,.3), 0 4px 10px rgba(15,23,42,.12);
      transition: transform .22s ease, box-shadow .22s ease, filter .22s ease;
    }

    .floating-contact::before {
      content: "?";
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      color: #2563eb;
      background: #fff;
      border-radius: 50%;
      font-weight: 800;
    }

    .floating-contact:hover {
      transform: translateY(-3px);
      filter: brightness(1.06);
      box-shadow: 0 18px 38px rgba(37,99,235,.38);
    }

    @media (max-width:900px) {
      .session-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .demo-grid { grid-template-columns: repeat(2,minmax(0,1fr)); }
      .demo-card, .demo-card:nth-child(4), .demo-card:nth-child(5) { grid-column: auto; }

      [data-global-header] .nav-right { display: none; }
      [data-global-header] .mobile-toggle { display: inline-flex; }
    }

    @media (max-width:640px) {
      body { padding-bottom: 74px; }
      .page { border-radius: 0; }
      .hero { padding: 54px 6%; }
      section { padding: 42px 6%; }
      .session-grid, .demo-grid { grid-template-columns: 1fr; gap: 15px; }
      .session-card, .demo-copy { min-height: auto; }
      .next-box { padding: 29px 24px; border-radius: 19px; }

      .floating-contact {
        right: 16px;
        bottom: 16px;
        min-height: 50px;
        padding: 0 17px;
        font-size: 13px;
      }
    }

    @media (prefers-reduced-motion:reduce) {
      html { scroll-behavior: auto; }
      * { transition: none !important; }
      .session-card:hover, .demo-card:hover, .button:hover, .floating-contact:hover { transform: none; }
    }
  </style>
</head>

<body>
  <header data-global-header aria-label="사이트 헤더"></header>

  <main class="page">
    <!-- 기존 main 콘텐츠(세미나 카드/데모 등)는 그대로 유지 -->
    <!-- ... 현재 파일의 본문 콘텐츠 그대로 ... -->
  </main>

  <script>
    (function () {
      const headerHTML = `
        <nav aria-label="글로벌 네비게이션">
          <div class="nav-inner">
            <div class="nav-left">
              <a class="brand" href="/">MEGAZONE × Microsoft</a>
            </div>

            <div class="nav-right" role="menubar" aria-label="데스크톱 메뉴">
              <a class="nav-link" href="/">홈</a>

              <div class="nav-dropdown">
                <button class="nav-dropdown-toggle" type="button" aria-expanded="false" aria-haspopup="true">
                  세미나 자료
                  <span class="chevron">⌄</span>
                </button>
                <div class="nav-dropdown-menu dropdown-shadow" role="menu">
                  <a class="dropdown-item" href="/wietraum0301/megazonemsusmc/blob/main/busan_seminar_thankyou.html">
                    부산 세미나 Thank You
                    <span class="dropdown-arrow">→</span>
                  </a>
                  <a class="dropdown-item" href="#">
                    발표자료 모음
                    <span class="dropdown-arrow">→</span>
                  </a>
                  <a class="dropdown-item" href="#">
                    데모영상 모음
                    <span class="dropdown-arrow">→</span>
                  </a>
                </div>
              </div>

              <a class="nav-link" href="#sessions-title">세션</a>
              <a class="nav-link" href="#demos-title">데모</a>
            </div>

            <button class="mobile-toggle" type="button" aria-expanded="false" aria-controls="mobile-menu" aria-label="메뉴 열기/닫기">☰</button>
          </div>

          <div id="mobile-menu" class="mobile-menu" aria-label="모바일 메뉴">
            <a href="/">홈</a>
            <a href="/wietraum0301/megazonemsusmc/blob/main/busan_seminar_thankyou.html">부산 세미나 Thank You</a>
            <a href="#sessions-title">세션</a>
            <a href="#demos-title">데모</a>
          </div>
        </nav>
      `;

      const mount = document.querySelector("[data-global-header]");
      if (!mount) return;
      mount.innerHTML = headerHTML;

      const dropdowns = Array.from(mount.querySelectorAll(".nav-dropdown"));
      const closeAllDropdowns = () => {
        dropdowns.forEach((d) => {
          d.classList.remove("active");
          const btn = d.querySelector(".nav-dropdown-toggle");
          if (btn) btn.setAttribute("aria-expanded", "false");
        });
      };

      dropdowns.forEach((dropdown) => {
        const btn = dropdown.querySelector(".nav-dropdown-toggle");
        if (!btn) return;

        btn.addEventListener("click", (e) => {
          e.preventDefault();
          const willOpen = !dropdown.classList.contains("active");
          closeAllDropdowns();
          if (willOpen) {
            dropdown.classList.add("active");
            btn.setAttribute("aria-expanded", "true");
          }
        });
      });

      document.addEventListener("click", (e) => {
        if (!mount.contains(e.target)) closeAllDropdowns();
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeAllDropdowns();
      });

      const mobileToggle = mount.querySelector(".mobile-toggle");
      const mobileMenu = mount.querySelector("#mobile-menu");

      if (mobileToggle && mobileMenu) {
        mobileToggle.addEventListener("click", () => {
          const isOpen = mobileMenu.classList.toggle("open");
          mobileToggle.setAttribute("aria-expanded", String(isOpen));
        });
      }
    })();
  </script>
</body>
</html>
